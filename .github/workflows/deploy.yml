# Builds the site and publishes it to GitHub Pages every time main changes.
# If validation or the link audit fails, the build fails and nothing is deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The project has no dependencies, so there is nothing to install.
      # BASE_PATH is the repository name because the site lives at
      # https://<user>.github.io/<repository>/. With a custom domain (Session 27) make it empty.
      - name: Build the site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4