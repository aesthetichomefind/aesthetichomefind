# Admin panel settings (Sveltia CMS, same format as Decap CMS).
# Every save creates a commit on the main branch, and GitHub Actions deploys it.

backend:
  name: github
  repo: aesthetichomefind/aesthetichomefind
  branch: main

publish_mode: simple
site_url: https://aesthetichomefind.github.io/aesthetichomefind/

# Default place for uploaded images. Product photos go here.
media_folder: assets/images/products
public_folder: /assets/images/products

collections:
  # ---------------------------------------------------------------- Products
  - name: products
    label: Products
    label_singular: Product
    folder: content/products
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false # never delete: tick "Archived" instead (the file stays for history)
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title, publishedAt]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: relation
        collection: categories
        search_fields: [name]
        value_field: slug
        display_fields: [name]
      - label: Photo
        name: image
        widget: image
        hint: "Square photo, about 1200 px, JPG or WebP, under 300 KB. Use your own photo or one you have permission to use. Do not save images from Amazon pages."
      - label: Photo description (alt text)
        name: altText
        widget: string
        hint: "Describe what is in the photo, for people who cannot see it. Example: Bamboo organizer with three compartments on a kitchen counter."
      - label: Description
        name: description
        widget: text
        hint: "Write it in your own words. No prices, ratings, discounts, stock claims or invented experiences."
      - label: Amazon link
        name: amazonUrl
        widget: string
        pattern: ["^https://", "Paste the full Amazon Special Link, starting with https://"]
        hint: "Paste the Special Link exactly as Amazon gives it. Never edit or build it yourself."
      - label: Instagram post link (optional)
        name: instagramUrl
        widget: string
        required: false
        pattern: ["^https://(www\\.)?instagram\\.com/", "Must be an instagram.com link"]
      - { label: Featured on the homepage, name: featured, widget: boolean, default: false }
      - label: Page address name (slug)
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use only lowercase letters, numbers and hyphens, for example bamboo-kitchen-organizer"]
        hint: "Becomes the page address and the file name. Choose it once and do not change it later."
      - { label: ID, name: id, widget: compute, value: "{{fields.slug}}" }
      - label: Date published
        name: publishedAt
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        default: "{{now}}"
      - label: Short description (optional)
        name: shortDescription
        widget: string
        required: false
        pattern: ["^.{0,160}$", "Up to 160 characters"]
        hint: "Shown on the product card. Up to 160 characters."
      - label: Key features (optional)
        name: features
        widget: list
        required: false
        field: { label: Feature, name: feature, widget: string }
      - label: Why it caught our attention (optional)
        name: body
        widget: text
        required: false
        hint: "A few honest sentences. A blank line starts a new paragraph. Do not claim you tested it unless you did."
      - label: Tags (optional)
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - label: Badge (optional)
        name: badge
        widget: select
        options: ["New", "Featured"]
        required: false
      - label: More photos (optional)
        name: additionalImages
        widget: list
        required: false
        field: { label: Photo, name: image, widget: image }
      - { label: Search title (optional), name: seoTitle, widget: string, required: false, hint: "Up to 70 characters." }
      - { label: Search description (optional), name: seoDescription, widget: text, required: false, hint: "Up to 170 characters." }
      - { label: Draft (hide for now), name: draft, widget: boolean, default: false }
      - { label: Archived (remove from the site), name: archived, widget: boolean, default: false }

  # -------------------------------------------------------------- Categories
  - name: categories
    label: Categories
    label_singular: Category
    folder: content/categories
    extension: json
    format: json
    create: true
    delete: false
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}}"
    media_folder: /assets/images/categories
    public_folder: /assets/images/categories
    fields:
      - { label: Name, name: name, widget: string }
      - label: Page address name (slug)
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use only lowercase letters, numbers and hyphens"]
        hint: "Becomes the page address. Do not change it later."
      - { label: Description, name: description, widget: text }
      - { label: Order, name: order, widget: number, value_type: int, min: 1, hint: "1 shows first." }
      - { label: Photo (optional), name: image, widget: image, required: false }
      - { label: Search title (optional), name: seoTitle, widget: string, required: false }
      - { label: Search description (optional), name: seoDescription, widget: text, required: false }

  
  # ----------------------------------------------------------- Site settings
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: data/site.json
        format: json
        fields:
          - { label: Brand name, name: brandName, widget: string }
          - { label: Tagline, name: tagline, widget: string, hint: "Short line shown on the homepage and in search results." }
          - { label: Site description, name: description, widget: text, hint: "One or two sentences. Used as the default description for search engines." }
          - label: Instagram handle
            name: instagramHandle
            widget: string
            pattern: ["^@[A-Za-z0-9._]+$", "Start with @, for example @AestheticHomeFind"]
          - label: Instagram profile link
            name: instagramUrl
            widget: string
            pattern: ["^https://(www\\.)?instagram\\.com/", "Must be an instagram.com link"]
          - label: Amazon Associate disclosure
            name: amazonDisclosure
            widget: string
            hint: "Required wording. Only change it if the Amazon Associates agreement changes. It appears in the footer and on product pages and guides."
          - label: Contact email
            name: contactEmail
            widget: string
            pattern: ["^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Enter a valid email address"]
            hint: "Shown on the Contact page."
  
  
  # ------------------------------------------------------------------ Guides
  - name: guides
    label: Guides
    label_singular: Guide
    folder: content/guides
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false # never delete: keep "Draft" on to hide a guide
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title, date]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Page address name (slug)
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use only lowercase letters, numbers and hyphens, for example small-kitchen-organization"]
        hint: "Becomes the page address and the file name. Choose it once and do not change it later."
      - label: Short description
        name: description
        widget: text
        hint: "One or two sentences shown on guide cards and in search results. Write it in your own words."
      - label: Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        default: "{{now}}"
      - label: Related products (optional)
        name: relatedProducts
        widget: relation
        collection: products
        search_fields: [title]
        value_field: slug
        display_fields: [title]
        multiple: true
        required: false
        hint: "Products mentioned in the guide. They appear as 'Related finds' under the guide, and the guide is linked from those product pages."
      - label: Article
        name: body
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: []
        hint: "Use headings, short paragraphs and lists. Images and tables are not supported yet. Write only what is true: no prices, ratings, discounts, or claims that you tested something unless you did. The Amazon disclosure is added automatically."
      - { label: Search title (optional), name: seoTitle, widget: string, required: false, hint: "Up to 70 characters." }
      - { label: Search description (optional), name: seoDescription, widget: text, required: false, hint: "Up to 170 characters." }
      - { label: Draft (keep hidden until ready), name: draft, widget: boolean, default: true }

