  <header class="site-header">
    <div class="container site-header__bar">
      <a class="brand" href="{{homeUrl}}">{{brandName}}</a>

      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul class="site-nav__list" role="list">
        {{mainLinks}}
          <li class="site-nav__social"><a href="{{instagramUrl}}" target="_blank" rel="noopener noreferrer">Instagram<span class="visually-hidden"> (opens in a new tab)</span></a></li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <a class="icon-btn" href="{{searchUrl}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="visually-hidden">Search</span>
        </a>
        <a class="icon-btn site-header__instagram" href="{{instagramUrl}}" target="_blank" rel="noopener noreferrer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg>
          <span class="visually-hidden">Instagram (opens in a new tab)</span>
        </a>
        <button class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
          <span class="menu-toggle__icon" aria-hidden="true"></span>
          <span class="visually-hidden">Menu</span>
        </button>
      </div>
    </div>
  </header>
